name: Publish

on:
  # 手动补发（OIDC 要求 workflow_ref 指向本文件，故发布必须在本文件内执行）
  workflow_dispatch:
  # 自动发布：Quality 在 master 上因 push 成功结束后触发
  workflow_run:
    workflows: ["Quality"]
    types: [completed]
    branches: [master]

permissions:
  contents: write
  checks: read
  actions: read
  id-token: write

jobs:
  publish:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      # workflow_run 事件的 github.sha 是默认分支末次提交，必须显式取上游 run 的 head_sha
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build:lib
      - name: Require Quality for this commit
        uses: actions/github-script@v7
        env:
          SHA: ${{ env.TARGET_SHA }}
        with:
          script: |
            const sha = process.env.SHA
            const { data } = await github.rest.checks.listForRef({ ...context.repo, ref: sha, per_page: 100 })
            const check = data.check_runs
              .filter(run => run.name === 'quality' && run.app?.slug === 'github-actions')
              .sort((a, b) => b.id - a.id)[0]
            if (!check || check.status !== 'completed' || check.conclusion !== 'success') {
              throw new Error(`Quality must pass on ${sha} before publishing`)
            }
      - name: Publish to npm with OIDC trusted publishing
        env:
          # changesets 在成功时静默丢弃子进程输出，失败时只透出结论；
          # 打开 verbose 才能看到 OIDC token 交换 / provenance 校验的真实报错。
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          yarn publish-packages
      - name: Push release tags
        run: |
          git push origin --tags

name: Publish

on:
  workflow_dispatch:

permissions:
  contents: write
  checks: read
  actions: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build:lib
      - name: Require Quality for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.checks.listForRef({ ...context.repo, ref: context.sha, per_page: 100 });
            const check = data.check_runs.filter(run => run.name === 'quality' && run.app?.slug === 'github-actions').sort((a, b) => b.id - a.id)[0];
            if (!check || check.status !== 'completed' || check.conclusion !== 'success') throw new Error('Run and pass Quality on this exact commit before publishing');
      - name: Publish to npm with OIDC trusted publishing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          yarn publish-packages

name: Quality

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: PR number to build (bot-created release PRs)
        required: false
        type: string

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pull_request_number && format('refs/pull/{0}/head', inputs.pull_request_number) || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn check:types
      - run: yarn build:lib
      - run: yarn check:docs
      - run: yarn test
